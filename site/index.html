<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dota Pick</title>
<style>
  :root {
    --bg: #0d1016; --card: #151922; --card2: #1c212c; --line: #262c38;
    --text: #e8ebf0; --muted: #8a92a3; --dim: #5d6576;
    --good: #5bd98a; --bad: #ff6f6f; --gold: #e8b44d; --enemy: #e0605a; --ally: #55c47d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); font: 13px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 10px 14px 8px; border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .logo { font-weight: 700; letter-spacing: 1.5px; font-size: 13px; } .logo b { color: var(--gold); }
  #status { margin-left: auto; color: var(--dim); font-size: 11px; text-align: right; }
  #status.err { color: var(--bad); }

  .team { margin-bottom: 6px; }
  .team-name { font-size: 11px; font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .enemy .team-name { color: var(--enemy); } .ally .team-name { color: var(--ally); }
  .team-name button { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 11px; padding: 0; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .slot { position: relative; aspect-ratio: 16 / 10; border-radius: 8px; border: 1px dashed var(--line); background: var(--card);
          overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .role { position: relative; font-size: 10px; color: var(--dim); line-height: 1.15; text-align: center; padding: 0 2px; }
  .slot.filled .role { position: absolute; left: 0; right: 0; bottom: 0; color: #fff; background: linear-gradient(transparent, #000c); padding: 8px 2px 2px; font-size: 9px; }
  .slot.filled { border: 1px solid var(--line); }
  .enemy .slot.filled { border-color: #e0605a88; } .ally .slot.filled { border-color: #55c47d88; }
  .slot.me { border: 1px solid var(--gold) !important; }
  .slot .me-tag { position: absolute; top: 3px; left: 3px; z-index: 1; font-size: 9px; font-weight: 700; background: var(--gold); color: #1b1407; border-radius: 3px; padding: 0 4px; }
  .slot.active { box-shadow: 0 0 0 2px var(--gold); }
  .mepick { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; background: none; border: 0; padding: 5px 4px; border-radius: 7px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .seg button.on { background: var(--card2); color: var(--text); }
  .mepick .seg { flex: 1; }
  .tabs { margin-top: 8px; } .tabs button { padding: 7px 4px; font-weight: 600; font-size: 12.5px; }
  .tabs b { color: var(--gold); }

  main { padding: 10px 14px 30px; }
  .search { position: relative; display: flex; gap: 6px; margin-bottom: 8px; }
  #q { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 9px 12px;
       font: inherit; font-size: 16px; outline: none; }
  #q:focus { border-color: var(--gold); }
  .search .seg { flex: 0 0 auto; }
  .search .seg button.on[data-v="enemies"] { color: var(--enemy); } .search .seg button.on[data-v="allies"] { color: var(--ally); }
  #suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--card2); border: 1px solid var(--line);
             border-radius: 10px; padding: 4px; box-shadow: 0 12px 30px #000a; }
  .sug { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 6px; border-radius: 7px; text-align: left; }
  .sug:hover, .sug.first { background: var(--card); }
  .sug img { width: 48px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; }
  .sug small { color: var(--dim); margin-left: auto; font-size: 11px; }

  /* сетка героев как в пике Доты: блоки по атрибутам, вертикальные портреты */
  .group { margin-top: 10px; padding: 8px; background: #0a0c11; border: 1px solid var(--line); border-radius: 6px; }
  .group h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 7px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .group h3 img { width: 18px; height: 18px; }
  .heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 3px; }
  .hero { position: relative; padding: 0; border: 0; background: #000; aspect-ratio: 235 / 272; overflow: visible;
          box-shadow: 0 0 0 1px #000; transition: transform .08s, filter .12s; }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; filter: brightness(.88); }
  .hero:hover { transform: scale(1.15); z-index: 3; box-shadow: 0 0 0 1px #fff8, 0 6px 16px #000c; }
  .hero:hover img { filter: brightness(1.1); }
  .hero:hover::after { content: attr(data-name); position: absolute; left: 50%; top: calc(100% + 3px); transform: translateX(-50%);
                       background: #000e; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
  .hero.taken img { filter: grayscale(1) brightness(.35); }
  .hero.taken.e { box-shadow: 0 0 0 1px var(--enemy); } .hero.taken.a { box-shadow: 0 0 0 1px var(--ally); }
  @media (pointer: coarse) { .hero:hover { transform: none; } .hero:hover::after { content: none; } }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #000e; color: #fff; padding: 7px 14px;
           border-radius: 999px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .h { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 8px; }
  .h:first-child { margin-top: 0; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .pick { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 7px; border-radius: 10px; border: 1px solid transparent; }
  .pick:hover { background: var(--card); }
  .pick.sel { background: var(--card); border-color: var(--line); }
  .pick > img { width: 56px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 5px; }
  .pick .name { font-weight: 600; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos-v { color: var(--good); } .neg-v { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; background: var(--card2); border-radius: 4px; padding: 1px 5px 1px 1px; font-variant-numeric: tabular-nums; }
  .chip img { width: 22px; height: 13px; object-fit: cover; border-radius: 2px; }
  .chip.syn { box-shadow: inset 0 0 0 1px #55c47d88; }

  .card { scroll-margin-top: 230px; margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card-top { display: flex; align-items: center; gap: 12px; }
  .card-top img { width: 80px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; }
  .card-top .name { font-size: 15px; font-weight: 700; }
  .card-top .meta { color: var(--muted); font-size: 11px; }
  .take { margin-left: auto; background: var(--gold); color: #1b1407; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 12px; }
  .tips { margin: 12px 0 0; padding: 10px 12px; background: var(--card2); border-radius: 9px; list-style: none; }
  .tips li { padding: 3px 0 3px 16px; position: relative; } .tips li::before { content: "•"; position: absolute; left: 3px; color: var(--gold); }
  .bpos { margin-top: 12px; } .bpos button small { color: var(--dim); font-size: 9.5px; margin-left: 3px; } .bpos button.few { opacity: .4; }
  .note { color: var(--dim); font-size: 11px; margin-top: 6px; }
  .start { display: flex; flex-wrap: wrap; gap: 5px; }
  .start img { width: 46px; height: 34px; object-fit: cover; border-radius: 5px; background: var(--card2); }
  .order { list-style: none; padding: 0; margin: 0; counter-reset: n; }
  .order li { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); counter-increment: n; }
  .order li:first-child { border-top: 0; }
  .order li::before { content: counter(n); width: 16px; color: var(--dim); font-size: 11px; text-align: right; }
  .order img, .counter img { width: 46px; height: 34px; object-fit: cover; border-radius: 5px; background: var(--card2); }
  .order .min { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .order .pct { color: var(--dim); font-size: 10.5px; width: 34px; text-align: right; }
  .counter { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
  .counter:first-of-type { border-top: 0; }
  .counter .why { color: var(--muted); font-size: 11px; }

  /* широкий экран (программа на ПК): две колонки, вкладки не нужны */
  @media (min-width: 900px) {
    body { height: 100vh; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto 1fr; }
    .top { grid-column: 1 / -1; padding: 12px 20px; }
    .draft { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .tabs { display: none; }
    main { overflow-y: auto; padding: 14px 20px; }
    #heroesPage, #resultPage { display: block !important; }
    #resultPage { border-left: 1px solid var(--line); }
    .heroes { grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); }
    .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="bar"><div class="logo">DOTA <b>PICK</b></div><div id="status">Загружаю данные…</div></div>
  <div class="draft">
    <div class="team enemy"><div class="team-name">Враги</div><div class="slots" id="enemies"></div></div>
    <div class="team ally"><div class="team-name">Мы<button id="clear">Очистить всё</button></div><div class="slots" id="allies"></div>
      <div class="mepick">Я играю:<div class="seg" id="me"></div></div></div>
  </div>
  <div class="seg tabs" id="tabs"><button data-t="heroes" class="on">Герои</button><button data-t="result">Пик и сборка</button></div>
</div>

<main id="heroesPage">
  <div class="search">
    <input id="q" placeholder="Начни писать: баб, пудж, ам…" autocomplete="off" enterkeyhint="done" aria-label="Поиск героя">
    <div class="seg" id="target"></div>
    <div id="suggest" hidden></div>
  </div>
  <div class="groups" id="groups"></div>
</main>
<main id="resultPage" hidden><div id="result"></div></main>
<div class="toast" id="toast"></div>

<script>
// Скрипт Телеграма грузится в фоне (тег в конце страницы) и вызывает initTg; вне Телеграма tg так и остаётся null.
let tg = null;
function initTg() {
  const w = window.Telegram && Telegram.WebApp;
  if (!w || !w.initData) return;
  tg = w; tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0d1016"); tg.setBackgroundColor("#0d1016"); } catch (e) {}
  tg.MainButton.onClick(() => setTab("result"));
  renderDraft();
}
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const LOCAL = location.hostname === "127.0.0.1";  // программа на ПК (а не сайт для Телеграма)

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/-/g, " ").replace(/[^\p{L}\p{N} ]/gu, "").replace(/\s+/g, " ").trim();
const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const cls = x => x >= 0 ? "pos-v" : "neg-v";
const ROLES = ["Керри", "Мид", "Хардлайн", "Поддержка", "Полная поддержка"];
const SHORT = ["Керри", "Мид", "Хард", "Поддержка", "Фулл"];
const ATTRS = [["str", "Сила", "#e2554a", "strength"], ["agi", "Ловкость", "#4fcf6f", "agility"],
               ["int", "Интеллект", "#4aa3ff", "intelligence"], ["all", "Универсальные", "#d9a441", "universal"]];
const ICON = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/icons/hero_";
// вертикальный портрет, как в пике Доты; у нескольких новых героев его нет — тогда обычный, обрезанный по высоте
const vert = h => h.img.replace("/dota_react/heroes/", "/heroes/").replace(/\.png$/, "_vert.jpg");

let D = null, HEROES = [], BY = {};
const draft = {enemies: [0, 0, 0, 0, 0], allies: [0, 0, 0, 0, 0]};  // индекс слота = позиция − 1
let me = 0, active = null, target = "enemies", selected = 0, buildPos = 0, tab = "heroes";
try { me = +localStorage.getItem("me") || 0; } catch (e) {}

// ---------- расчёт ----------
const PRIOR = 100;
const rate = (g, w, exp) => (w + PRIOR * exp) / (g + PRIOR);
const clamp = x => Math.min(Math.max(x, 0.01), 0.99);
const baseWr = h => rate(D.stats.hg[h], D.stats.hw[h], 0.5);
const advantage = (a, b) => { const exp = clamp(baseWr(a) - baseWr(b) + 0.5); return rate(D.stats.vg[a][b], D.stats.vw[a][b], exp) - exp; };
const synergy = (a, b) => { const exp = clamp(baseWr(a) + baseWr(b) - 0.5); return rate(D.stats.sg[a][b], D.stats.sw[a][b], exp) - exp; };
function evaluate(h, enemies, allies) {
  const vs = enemies.map(e => ({id: e, adv: advantage(h, e), games: D.stats.vg[h][e]}));
  const syn = allies.map(a => ({id: a, adv: synergy(h, a), games: D.stats.sg[h][a]}));
  const sum = xs => xs.reduce((s, x) => s + x.adv, 0);
  return {id: h, score: sum(vs) + 0.5 * sum(syn) + 0.5 * (baseWr(h) - 0.5), wr: baseWr(h), vs, syn};
}
// позиции героя от самой частой к редкой (по про-матчам), иначе — по справочнику
function positions(h) {
  const g = [1, 2, 3, 4, 5].map(p => [p, D.games[`${h}-${p}`] || 0]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  return g.length ? g : BY[h].pos;
}
function suggest(enemies, allies, p) {
  const taken = new Set([...enemies, ...allies]);
  return HEROES.filter(h => !taken.has(h.id) && (!p || h.pos.includes(p)) && D.stats.hg[h.id] >= 100)
    .map(h => evaluate(h.id, enemies, allies)).sort((a, b) => b.score - a.score).slice(0, 8);
}
function teamItems(enemies, support) {
  const why = new Map(), add = (item, w) => { if (!why.has(item)) why.set(item, []); why.get(item).push(w); };
  for (const e of enemies) for (const item of D.counters[BY[e].name] || []) add(item, BY[e].name);
  for (const [role, label, core, sup] of [["Nuker", "много магии", ["Black King Bar", "Pipe of Insight"], ["Glimmer Cape", "Pipe of Insight"]],
                                          ["Disabler", "много контроля", ["Black King Bar", "Linken's Sphere"], ["Lotus Orb", "Force Staff"]]]) {
    const n = enemies.filter(e => BY[e].roles.includes(role)).length;
    if (n >= 4) for (const item of support ? sup : core) add(item, `${label} (${n} из ${enemies.length})`);
  }
  return [...why].filter(([item]) => !(support && D.core_only.includes(item))).sort((a, b) => b[1].length - a[1].length).slice(0, 6);
}
function tips(r, b, team) {
  const out = [...(D.rules[BY[r.id].name] || [])];
  const key = b.data && [...b.data.core].filter(x => x[1] >= 10).sort((x, y) => y[2] - x[2])[0];
  if (key) out.push(`Главный предмет — ${key[0]}: берут ${key[2]}% игроков, обычно к ~${key[1]} мин. Не успеваешь к ~${key[1] + 5} мин — фарми, а не дерись.`);
  if (r.vs.length) {
    const worst = [...r.vs].sort((x, y) => x.adv - y.adv)[0], best = [...r.vs].sort((x, y) => y.adv - x.adv)[0];
    const counter = (D.counters[BY[worst.id].name] || [])[0];
    if (worst.adv < -0.01) out.push(`Тяжелее всего против ${BY[worst.id].name} (${pct(worst.adv)})` + (counter ? ` — помогает ${counter}.` : "."));
    if (best.adv > 0.01) out.push(`Легче всего против ${BY[best.id].name} (${pct(best.adv)}) — его можно давить.`);
  }
  if (team.length && team[0][1].length > 1) out.push(`Против их состава в первую очередь — ${team[0][0]}: закрывает ${team[0][1].join(", ")}.`);
  if (r.wr >= 0.52) out.push(`Сильный герой в текущей мете: ${(r.wr * 100).toFixed(1)}% побед на Archon–Legend.`);
  if (r.wr <= 0.47) out.push(`Слабый в текущей мете: ${(r.wr * 100).toFixed(1)}% побед — пикай, только если хорошо им играешь.`);
  return out;
}
function build(hero, enemies, p) {
  const games = {}; for (let k = 1; k <= 5; k++) games[k] = D.games[`${hero}-${k}`] || 0;
  const best = positions(hero)[0];
  if (!p) p = best;
  let shown = p, note = "";
  if (D.builds[`${hero}-${p}`]) note = `${games[p]} про-матчей патча ${D.patch} на ${p} позиции`;
  else if (D.builds[`${hero}-${best}`]) { shown = best; note = `На ${p} позиции героя почти не играют — показана сборка для ${best} позиции`; }
  else note = "Мало про-матчей на этом герое — сборки нет";
  return {pos: p, games, note, data: D.builds[`${hero}-${shown}`], team: teamItems(enemies, p === 4 || p === 5)};
}

// ---------- драфт ----------
function renderDraft() {
  for (const team of ["enemies", "allies"]) {
    $("#" + team).innerHTML = draft[team].map((id, i) => {
      const h = BY[id], mine = team === "allies" && me === i + 1, on = active && active.team === team && active.i === i;
      return `<button class="slot${h ? " filled" : ""}${mine ? " me" : ""}${on ? " active" : ""}" data-team="${team}" data-i="${i}"
        title="${esc(h ? h.name + " — " + ROLES[i] : ROLES[i])}">${h ? `<img src="${h.img}" alt="">` : ""}
        ${mine ? '<span class="me-tag">Я</span>' : ""}<span class="role">${SHORT[i]}</span></button>`;
    }).join("");
  }
  $("#me").innerHTML = [[0, "—"], ...SHORT.map((t, i) => [i + 1, t])].map(([v, t]) =>
    `<button class="${v === me ? "on" : ""}" data-v="${v}">${t}</button>`).join("");
  const n = draft.enemies.filter(Boolean).length;
  $("#tabs").children[1].innerHTML = "Пик и сборка" + (n ? ` <b>${n}</b>` : "");
  if (tg) {
    if (n && tab === "heroes") { tg.MainButton.setParams({text: "Кого пикнуть →", color: "#e8b44d", text_color: "#1b1407"}); tg.MainButton.show(); }
    else tg.MainButton.hide();
  }
}
function refresh() { renderDraft(); renderGrid(); renderResult(); }

document.addEventListener("click", e => {
  const s = e.target.closest(".slot"); if (!s) return;
  const team = s.dataset.team, i = +s.dataset.i;
  if (draft[team][i]) { toast(`Убран ${BY[draft[team][i]].name}`); draft[team][i] = 0; active = null; }
  else { active = active && active.team === team && active.i === i ? null : {team, i}; if (active) toast(`Выбери героя на «${ROLES[i]}»`); }
  haptic(); refresh();
});
$("#me").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  me = +b.dataset.v; try { localStorage.setItem("me", me); } catch (e) {} buildPos = 0; haptic(); refresh(); };
$("#clear").onclick = () => { draft.enemies.fill(0); draft.allies.fill(0); active = null; refresh(); };

let toastT;
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1400); }

function place(id, team) {
  if (!id) return;
  if (draft.enemies.includes(id) || draft.allies.includes(id)) return toast(`${BY[id].name} уже выбран`);
  let i;
  if (active) { team = active.team; i = active.i; }
  else {
    team = team || target;
    const free = p => !draft[team][p - 1] && !(team === "allies" && p === me);  // свой слот «Я» заполняется только явно
    const p = positions(id).find(free) || [1, 2, 3, 4, 5].find(free);
    if (!p) return toast(team === "enemies" ? "Все 5 врагов уже выбраны" : "Наша команда заполнена");
    i = p - 1;
  }
  draft[team][i] = id; active = null; haptic();
  toast(`${BY[id].name} → ${team === "enemies" ? "враги" : "мы"}, ${ROLES[i]}`);
  $("#q").value = ""; renderSuggest(); refresh();
}

// ---------- поиск и сетка ----------
function rank(h, q) { let b = 9; for (const a of h.aliases) b = Math.min(b, a === q ? 0 : a.startsWith(q) ? 1 : a.includes(q) ? 2 : 9); return b; }
function matches() {
  const q = norm($("#q").value); if (!q) return [];
  return HEROES.map(h => [h, rank(h, q)]).filter(x => x[1] < 9).sort((a, b) => a[1] - b[1] || a[0].name.localeCompare(b[0].name)).slice(0, 6).map(x => x[0]);
}
function renderSuggest() {
  const list = matches(), box = $("#suggest");
  box.hidden = !$("#q").value.trim();
  box.innerHTML = list.length ? list.map((h, k) => `<button class="sug${k === 0 ? " first" : ""}" data-id="${h.id}">
    <img src="${h.img}" alt=""><span>${esc(h.name)}</span><small>${positions(h.id).slice(0, 2).map(p => SHORT[p - 1]).join(", ")}</small></button>`).join("")
    : '<div class="sug" style="color:var(--dim)">Не нашёл такого героя</div>';
}
function renderGrid() {
  const taken = new Set([...draft.enemies, ...draft.allies]);
  $("#groups").innerHTML = ATTRS.map(([a, title, color, icon]) => `<div class="group"><h3 style="color:${color}"><img src="${ICON}${icon}.png" alt="">${title}</h3><div class="heroes">` +
    HEROES.filter(h => h.attr === a).map(h => {
      const side = draft.enemies.includes(h.id) ? " taken e" : draft.allies.includes(h.id) ? " taken a" : "";
      return `<button class="hero${side}" data-id="${h.id}" data-name="${esc(h.name)}" aria-label="${esc(h.name)}">
        <img src="${vert(h)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${h.img}'"></button>`;
    }).join("") + "</div></div>").join("");
}
$("#q").oninput = renderSuggest;
$("#q").onkeydown = e => {
  if (e.key === "Enter") { const m = matches()[0]; if (m) place(m.id, e.shiftKey ? "allies" : null); else $("#q").blur(); }
  if (e.key === "Escape") { $("#q").value = ""; renderSuggest(); }
};
$("#suggest").onclick = e => { const b = e.target.closest(".sug[data-id]"); if (b) place(+b.dataset.id); };
$("#groups").onclick = e => { const b = e.target.closest(".hero"); if (b) place(+b.dataset.id); };
$("#groups").oncontextmenu = e => { const b = e.target.closest(".hero"); if (b) { e.preventDefault(); place(+b.dataset.id, "allies"); } };
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#suggest").hidden = true; });
$("#target").onclick = e => { const b = e.target.closest("button"); if (!b) return; target = b.dataset.v; active = null; renderTarget(); };
const renderTarget = () => $("#target").innerHTML = [["enemies", "Враги"], ["allies", "Мы"]].map(([v, t]) =>
  `<button class="${v === target ? "on" : ""}" data-v="${v}">${t}</button>`).join("");
if (!matchMedia("(pointer: coarse)").matches) document.addEventListener("keydown", e => {  // ПК: начал печатать — сразу в поиск
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && document.activeElement !== $("#q")) $("#q").focus();
});

// ---------- вкладки (телефон) ----------
function setTab(t) {
  tab = t;
  for (const b of $("#tabs").children) b.classList.toggle("on", b.dataset.t === t);
  $("#heroesPage").hidden = t !== "heroes"; $("#resultPage").hidden = t !== "result";
  renderDraft(); renderResult(); window.scrollTo(0, 0);
}
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.t); };

// ---------- результат ----------
const img = n => D.items[n] || "";
const chip = (x, syn) => `<span class="chip${syn ? " syn" : ""}" title="${esc(BY[x.id].name)}"><img src="${BY[x.id].img}" alt=""><span class="${cls(x.adv)}">${pct(x.adv)}</span></span>`;
const chipsHtml = r => r.vs.map(x => chip(x)).join("") + r.syn.map(x => chip(x, true)).join("");

function card(r, take) {
  const h = BY[r.id], b = build(r.id, draft.enemies.filter(Boolean), buildPos || me), d = b.data;
  const t = tips(r, b, b.team);
  return `<div class="card"><div class="card-top"><img src="${h.img}" alt=""><div><div class="name">${esc(h.name)}</div>
      <div class="meta">${r.vs.length ? `против их команды <span class="${cls(r.score)}">${pct(r.score)}</span> · ` : ""}${(r.wr * 100).toFixed(1)}% побед</div></div>
      ${take ? `<button class="take" data-take="${r.id}">Беру</button>` : ""}</div>
    ${r.vs.length || r.syn.length ? `<div class="chips" style="margin-top:10px">${chipsHtml(r)}</div>` : ""}
    ${t.length ? `<ul class="tips">${t.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <div class="seg bpos">${[1, 2, 3, 4, 5].map(p => `<button class="${p === b.pos ? "on" : ""}${b.games[p] < D.min_games ? " few" : ""}" data-bpos="${p}">${SHORT[p - 1]}<small>${b.games[p]}</small></button>`).join("")}</div>
    <div class="note">${esc(b.note)}</div>
    ${d ? `<div class="h">Старт</div><div class="start">${d.start.map(n => `<img src="${img(n)}" alt="${esc(n)}" title="${esc(n)}">`).join("")}</div>
      <div class="h">Порядок закупа</div><ol class="order">${d.core.map(([n, m, p]) =>
        `<li><img src="${img(n)}" alt=""><span>${esc(n)}</span><span class="min">~${m} мин</span><span class="pct">${p}%</span></li>`).join("")}</ol>
      ${d.extra.length ? `<div class="h">По ситуации</div><ol class="order" style="counter-reset:none">${d.extra.map(([n, m, p]) =>
        `<li style="counter-increment:none"><img src="${img(n)}" alt=""><span>${esc(n)}</span><span class="min">~${m} мин</span><span class="pct">${p}%</span></li>`).join("")}</ol>` : ""}` : ""}
    ${b.team.length ? `<div class="h">Против их команды</div>${b.team.map(([n, why]) =>
      `<div class="counter"><img src="${img(n)}" alt=""><div><div>${esc(n)}</div><div class="why">${esc(why.join(", "))}</div></div></div>`).join("")}` : ""}
  </div>`;
}
function renderResult() {
  if (!D || (tab !== "result" && !matchMedia("(min-width: 900px)").matches)) return;
  const enemies = draft.enemies.filter(Boolean), mine = me && draft.allies[me - 1];
  const allies = draft.allies.filter((id, i) => id && i !== me - 1);
  if (mine) {
    $("#result").innerHTML = `<div class="h">Твой герой</div>` + card(evaluate(mine, enemies, allies), false);
    return;
  }
  if (!enemies.length) {
    $("#result").innerHTML = `<div class="empty"><b>Добавь врагов</b>Начни писать имя героя в поиске или выбери в списке.<br>
      Выбери «Я играю» — покажу пик и сборку под твою позицию.</div>`;
    return;
  }
  const picks = suggest(enemies, allies, me);
  if (!picks.some(p => p.id === selected)) { selected = picks.length ? picks[0].id : 0; buildPos = 0; }
  $("#result").innerHTML = `<div class="h">Кого пикнуть${me ? " на " + ROLES[me - 1].toLowerCase() : ""}</div>` + (picks.length ? picks.map(r =>
    `<div class="pick${r.id === selected ? " sel" : ""}" data-id="${r.id}"><img src="${BY[r.id].img}" alt="">
      <div><div class="name">${esc(BY[r.id].name)}</div><div class="chips">${chipsHtml(r)}</div></div>
      <div class="score ${cls(r.score)}">${pct(r.score)}</div></div>`).join("") : '<div class="empty">Нет вариантов</div>') +
    (picks.length ? card(picks.find(p => p.id === selected), true) : "");
}
$("#result").onclick = e => {
  const t = e.target.closest("[data-take]");
  if (t) {
    const id = +t.dataset.take;
    if (!me) { me = positions(id)[0]; try { localStorage.setItem("me", me); } catch (e) {} }
    const i = draft.allies.indexOf(id); if (i >= 0) draft.allies[i] = 0;
    draft.allies[me - 1] = id; buildPos = 0; haptic(); toast(`Ты играешь на ${BY[id].name}`); return refresh();
  }
  const bp = e.target.closest("[data-bpos]");
  if (bp) { buildPos = +bp.dataset.bpos; haptic(); const y = scrollY, box = $("#resultPage"), by = box.scrollTop; renderResult(); scrollTo(0, y); box.scrollTop = by; return; }
  const row = e.target.closest(".pick");
  if (row) { selected = +row.dataset.id; buildPos = 0; haptic(); renderResult(); $(".card").scrollIntoView({block: "start"}); }
};

// ---------- загрузка ----------
function ago(t) { const h = Math.round((Date.now() / 1000 - t) / 3600); return h < 1 ? "только что" : h < 48 ? h + " ч назад" : Math.round(h / 24) + " дн назад"; }
// Последние данные храним на устройстве: нет связи (упал сервер, плохой интернет) — работаем на них.
const SAVED = "dota-pick-data";
function showStatus(note, err) {
  $("#status").className = err ? "err" : "";
  $("#status").textContent = `патч ${D.patch} · ${Math.round(D.matches / 1000)} тыс. матчей · ${ago(D.updated)}` + (note || "");
}
function use(data, note) {
  D = data; HEROES = D.heroes.sort((a, b) => a.name.localeCompare(b.name)); for (const h of HEROES) BY[h.id] = h;
  showStatus(note); refresh();
}
async function load() {
  try {
    const r = await fetch("data.json", {cache: "no-cache"});
    if (r.status === 503 && !D) { const s = await r.json(); $("#status").textContent = s.error || s.progress + " · первый запуск ~2 мин"; return setTimeout(load, 3000); }
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    use(JSON.parse(text));
    try { localStorage.setItem(SAVED, text); } catch (e) {}
  } catch (e) {
    if (D) showStatus(" · нет связи, работаю на сохранённых данных", true);  // сохранённые уже показаны при запуске
    else { $("#status").textContent = "Нет связи с сервером — пробую снова…"; $("#status").className = "err"; }
    setTimeout(load, 15000);
  }
}
if (LOCAL) {  // программа на ПК: сообщаем, что окно открыто, и выключаемся, когда его закрыли
  setInterval(() => fetch("/api/ping").then(r => r.json()).then(s => { if (D && s.loading) $("#status").textContent = s.progress + " · обновляю данные"; }).catch(() => {}), 5000);
  addEventListener("pagehide", () => navigator.sendBeacon("/api/bye"));
}
renderTarget(); renderDraft();
try { const saved = JSON.parse(localStorage.getItem(SAVED)); if (saved) use(saved, " · обновляю…"); } catch (e) {}  // сразу показываем прошлые данные
load();
if (!matchMedia("(pointer: coarse)").matches) $("#q").focus();
</script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="initTg()"></script>
</body>
</html>
